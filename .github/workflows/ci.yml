name: Resin Slicer CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: resin-slicer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  container-acceptance:
    # Avoid doing the expensive PrusaSlicer source build twice for PR branches.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pinned resin slicer image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: workpiece-resin-slicer:acceptance
          # Cache every intermediate Prusa/dependency layer so normal service/profile
          # changes do not rebuild the pinned C++ toolchain from scratch.
          cache-from: type=gha,scope=resin-slicer-prusa-2.9.6
          cache-to: type=gha,mode=max,scope=resin-slicer-prusa-2.9.6

      - name: Start acceptance service
        run: |
          docker run -d --name workpiece-resin-acceptance \
            -p 18080:8080 \
            -e WORKPIECE_RESIN_PROJECT_API_TOKEN=acceptance-token \
            workpiece-resin-slicer:acceptance
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          docker logs workpiece-resin-acceptance
          exit 1

      - name: Generate deterministic acceptance STL
        run: python3 scripts/make_acceptance_stl.py

      - name: Generate Mars 2 grey review bundle
        run: |
          if ! curl --fail-with-body \
            -H 'Authorization: Bearer acceptance-token' \
            -F 'file=@acceptance-cube.stl;type=model/stl' \
            -F 'printer_profile=elegoo-mars-2' \
            -F 'resin_profile=elegoo-water-washable-grey' \
            -F 'quality=balanced-0p05-medium' \
            -F 'rotate_x=15' \
            -F 'rotate_y=0' \
            -F 'rotate_z=25' \
            -D acceptance-headers.txt \
            -o acceptance-bundle.zip \
            http://127.0.0.1:18080/v1/candidate; then
            echo 'Candidate request failed. Response headers:'
            cat acceptance-headers.txt || true
            echo 'Candidate response body:'
            cat acceptance-bundle.zip || true
            echo
            echo 'Acceptance service logs:'
            docker logs workpiece-resin-acceptance || true
            exit 1
          fi
          cat acceptance-headers.txt
          unzip -l acceptance-bundle.zip

      - name: Verify bundle provenance and recipe structure
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import zipfile
          from pathlib import Path

          expected_source = Path('acceptance-cube.stl').read_bytes()
          bundle = Path('acceptance-bundle.zip').read_bytes()
          with zipfile.ZipFile(io.BytesIO(bundle)) as zf:
              manifest = json.loads(zf.read('manifest.json'))
              assert manifest['authority'] == 'acceptance-candidate-only'
              assert manifest['provenance_chain'] == ['source_stl', 'review_3mf', 'intermediate_sl1', 'printer_native']
              assert manifest['slice_recipe']['geometry'] == 'review_3mf'
              assert manifest['slice_recipe']['configuration'] == 'effective_config'
              assert manifest['profiles'] == {
                  'printer': 'elegoo-mars-2',
                  'resin': 'elegoo-water-washable-grey',
                  'quality': 'balanced-0p05-medium',
              }
              assert manifest['orientation_deg'] == {'x': 15, 'y': 0, 'z': 25}
              assert manifest['engine']['prusaslicer'] == {
                  'version': '2.9.6',
                  'commit': 'b028299c770b8380ee81c921a2867d522f288123',
              }
              assert manifest['engine']['uvtools']['version'] == '6.2.0'

              files = manifest['files']
              for key in ('source_stl', 'review_3mf', 'effective_config', 'intermediate_sl1', 'printer_native'):
                  name = files[key]['name']
                  payload = zf.read(name)
                  assert payload, f'{key} is empty'
                  assert hashlib.sha256(payload).hexdigest() == files[key]['sha256']

              source_payload = zf.read(files['source_stl']['name'])
              assert source_payload == expected_source, 'bundle source STL differs from submitted acceptance STL'
              assert files['review_3mf']['name'].endswith('.3mf')
              assert files['effective_config']['name'].endswith('.ini')
              assert files['printer_native']['name'].endswith('.ctb')

              project = zf.read(files['review_3mf']['name'])
              effective_config = zf.read(files['effective_config']['name'])
              native_name = files['printer_native']['name']
              Path('acceptance-out').mkdir(exist_ok=True)
              Path('acceptance-out/review.3mf').write_bytes(project)
              Path('acceptance-out/effective.ini').write_bytes(effective_config)
              Path('acceptance-out/print.ctb').write_bytes(zf.read(native_name))
              Path('acceptance-out/manifest.json').write_bytes(zf.read('manifest.json'))
              Path('acceptance-out/uvtools-issues.txt').write_bytes(zf.read('uvtools-issues.txt'))

          with zipfile.ZipFile(io.BytesIO(project)) as project_zip:
              project_names = project_zip.namelist()
              assert '[Content_Types].xml' in project_names
              assert any(name.lower().endswith('.model') for name in project_names)
              embedded_config = [name for name in project_names if 'config' in name.lower()]
              support_points = [name for name in project_names if 'sla_support_points' in name.lower()]
              Path('acceptance-out/project-contents.txt').write_text('\n'.join(project_names) + '\n')
              Path('acceptance-out/project-config-state.txt').write_text(
                  ('non-authoritative config-like 3MF entries: ' + ', '.join(embedded_config) + '\n') if embedded_config
                  else 'no embedded Prusa config expected; effective.ini is the authoritative slicing configuration\n'
              )
              Path('acceptance-out/support-point-state.txt').write_text(
                  ('explicit support-point metadata: ' + ', '.join(support_points) + '\n') if support_points
                  else 'no explicit support-point metadata; automatic supports regenerate from retained effective.ini during slicing\n'
              )
              print('3MF entries:', len(project_names))
              print('Config-like 3MF entries:', embedded_config)
              print('Explicit SLA support-point metadata:', bool(support_points))
          PY

      - name: Inspect generated CTB with the pinned UVtools
        run: |
          docker run --rm \
            -v "$PWD/acceptance-out:/work:rw" \
            --entrypoint /opt/uvtools/UVtoolsCmd \
            workpiece-resin-slicer:acceptance \
            print-properties /work/print.ctb > acceptance-out/ctb-properties.txt
          cat acceptance-out/ctb-properties.txt

      - name: Upload real acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mars2-grey-cp1-acceptance
          path: |
            acceptance-bundle.zip
            acceptance-headers.txt
            health.json
            acceptance-out/
          if-no-files-found: error

      - name: Container logs on failure
        if: failure()
        run: docker logs workpiece-resin-acceptance || true
