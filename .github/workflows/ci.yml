name: Resin Slicer CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      toolchain_image:
        description: "Toolchain image to run the container acceptance against (built from Dockerfile.toolchain)"
        required: false
        type: string
        default: ""

concurrency:
  group: resin-slicer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  container-acceptance:
    # Real-toolchain run; dispatch only, because the toolchain image is built on the host, not published.
    needs: unit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.toolchain_image != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TOOLCHAIN_IMAGE: ${{ inputs.toolchain_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull toolchain image
        run: docker pull "$TOOLCHAIN_IMAGE"

      - name: Build Workpiece resin service image
        run: |
          docker build \
            --build-arg "TOOLCHAIN_IMAGE=$TOOLCHAIN_IMAGE" \
            --build-arg "SERVICE_COMMIT=$GITHUB_SHA" \
            -t workpiece-resin-slicer:acceptance \
            .

      - name: Start acceptance service
        run: |
          docker run -d --name workpiece-resin-acceptance \
            -p 18080:8080 \
            -e WORKPIECE_RESIN_PROJECT_API_TOKEN=acceptance-token \
            workpiece-resin-slicer:acceptance
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify engines are available
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          health = json.loads(Path('health.json').read_text())
          assert health['engines']['prusaslicer']['available'] is True
          assert health['engines']['uvtools']['available'] is True
          assert health['profiles_ready'] is True
          PY

      - name: Generate acceptance STL
        run: python3 scripts/make_acceptance_stl.py

      - name: Estimate the cube
        run: |
          curl --fail-with-body \
            -H 'Authorization: Bearer acceptance-token' \
            -F 'file=@acceptance-cube.stl;type=model/stl' \
            -F 'printer_profile=elegoo-mars-2' \
            -F 'resin_profile=elegoo-water-washable-grey' \
            -F 'quality=balanced-0p05-medium' \
            -o estimate.json \
            http://127.0.0.1:18080/v1/estimate
          python3 -c "import json; e=json.load(open('estimate.json')); print(json.dumps(e['summary'], indent=2)); assert e['summary']['layer_count'] > 100"

      - name: Build a two-plate order project
        run: |
          curl --fail-with-body --max-time 2400 \
            -H 'Authorization: Bearer acceptance-token' \
            -F 'file=@acceptance-cube.stl;type=model/stl' \
            -F 'printer_profile=elegoo-mars-2' \
            -F 'resin_profile=elegoo-water-washable-grey' \
            -F 'quality=balanced-0p05-medium' \
            -F 'requested_quantity=40' \
            -F 'finalist_limit=2' \
            -D project-headers.txt \
            -o project.zip \
            http://127.0.0.1:18080/v1/project
          cat project-headers.txt
          unzip -o project.zip -d project-out
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('project-out/project.json').read_text())
          assert manifest['totals']['instances'] == 40
          assert manifest['totals']['plates'] >= 2
          for plate in manifest['plates']:
              for record in plate['files'].values():
                  data = Path('project-out', record['name']).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == record['sha256'], record['name']
          print(json.dumps({k: manifest[k] for k in ('layout', 'totals', 'warnings')}, indent=2))
          PY

      - name: Measure the bed-to-CTB mapping of plate 1
        run: |
          docker run --rm -v "$PWD/project-out:/work:rw" --entrypoint /usr/bin/env workpiece-resin-slicer:acceptance \
            python3 /app/scripts/calibrate_mars2_mapping.py /work/project.json /work/acceptance-cube-plate-01.ctb || true

      - name: Upload acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mars2-grey-acceptance
          path: |
            health.json
            estimate.json
            project-headers.txt
            project.zip
          if-no-files-found: error

      - name: Container logs on failure
        if: failure()
        run: docker logs workpiece-resin-acceptance || true
